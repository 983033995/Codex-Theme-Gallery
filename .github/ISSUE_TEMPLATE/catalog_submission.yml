name: 主题或宠物投稿
description: 提交一个可审核、可发布的 Gallery 内容包
title: "feat(catalog): "
labels: ["catalog-submission", "triage"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 内容类型
      options: ["主题", "宠物"]
    validations:
      required: true
  - type: input
    id: item-id
    attributes:
      label: ID（小写 kebab-case）
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SemVer 版本
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: 发布权与素材来源说明
      description: 请确认拥有或已取得所有素材的发布许可。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: "npm test 已通过"
          required: true
        - label: "内容包不含脚本、可执行文件、凭证、遥测或用户数据"
          required: true
        - label: "我接受维护者的视觉、版权和安全审核"
          required: true
